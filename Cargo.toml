[workspace]
members = [
    "crates/prismatic-core",
    "crates/prismatic-service",
    "apps/prismatic-settings",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/CoJoA13/Prismatic"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
zbus = { version = "5.11", features = ["tokio"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time"] }
libadwaita = { version = "0.9.2", features = ["v1_9", "gtk_v4_22"], package = "libadwaita" }
